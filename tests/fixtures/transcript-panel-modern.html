<!doctype html>
<html>
<body>
  <ytd-engagement-panel-section-list-renderer target-id="PAmodern_transcript_view" visibility="ENGAGEMENT_PANEL_VISIBILITY_EXPANDED">
    <div id="visibility-button"><yt-button-shape><button aria-label="Close"></button></yt-button-shape></div>
    <yt-section-list-renderer data-target-id="PAmodern_transcript_view">
    <macro-markers-panel-item-view-model class="ytwMacroMarkersPanelItemViewModelHost" tabindex="0" role="button">
      <timeline-item-view-model class="ytwTimelineItemViewModelHost">
        <div class="ytwTimelineItemViewModelContentItems">
          <transcript-segment-view-model class="ytwTranscriptSegmentViewModelHost">
            <div aria-hidden="true" class="ytwTranscriptSegmentViewModelTimestamp">0:18</div>
            <div class="ytwTranscriptSegmentViewModelTimestampA11yLabel">18 seconds</div>
            <span class="ytAttributedStringHost ytAttributedStringLinkInheritColor" role="text">First line of the fixture</span>
          </transcript-segment-view-model>
        </div>
      </timeline-item-view-model>
    </macro-markers-panel-item-view-model>
    <macro-markers-panel-item-view-model class="ytwMacroMarkersPanelItemViewModelHost" tabindex="0" role="button">
      <timeline-item-view-model class="ytwTimelineItemViewModelHost">
        <div class="ytwTimelineItemViewModelContentItems">
          <transcript-segment-view-model class="ytwTranscriptSegmentViewModelHost">
            <div aria-hidden="true" class="ytwTranscriptSegmentViewModelTimestamp">3:23</div>
            <div class="ytwTranscriptSegmentViewModelTimestampA11yLabel">3 minutes, 23 seconds</div>
            <span class="ytAttributedStringHost ytAttributedStringLinkInheritColor" role="text">Second line of the fixture</span>
          </transcript-segment-view-model>
        </div>
      </timeline-item-view-model>
    </macro-markers-panel-item-view-model>
    </yt-section-list-renderer>
  </ytd-engagement-panel-section-list-renderer>
</body>
</html>
